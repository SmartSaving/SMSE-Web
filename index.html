  :root { --bg:#000; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family:HMI, system-ui, sans-serif;
         -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  #stage { width:100vw; height:calc(100vw * 0.6); max-height:100vh; max-width:calc(100vh / 0.6); display:block; }
  .big   { font:600 39px HMI, sans-serif; }
  .val   { font:700 35px VAL, HMI, sans-serif; }
  .unit  { font:500 19px HMI, sans-serif; }
  .med   { font:600 22px HMI, sans-serif; }
  .btn   { font:700 14px HMI, sans-serif; letter-spacing:.2px; }
  .field { font:500 16px HMI, sans-serif; }
  .body  { font:400 12.5px HMI, sans-serif; }
  .small { font:400 11.5px HMI, sans-serif; }
  .hd    { font:600 15px HMI, sans-serif; }
  .chip  { font:700 9.5px HMI, sans-serif; letter-spacing:.2px; }
  .hit   { fill:transparent; cursor:pointer; }
  .hit:hover { fill:rgba(255,255,255,.04); }
  .page  { display:none; }
  .page.on { display:inline; }
  foreignObject input { width:100%; height:100%; box-sizing:border-box; background:transparent; border:0; outline:0;
         color:#f2f4f6; font:500 16px HMI, sans-serif; padding:0 0 0 6px; }
  #toast { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:rgba(20,22,26,.95);
           color:#f2f4f6; border:1px solid #3c4046; border-radius:10px; padding:8px 14px; font:500 13px HMI, sans-serif;
           opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.on { opacity:1; }
  /* ---------- RIWAYAT ---------- */
  foreignObject { white-space:normal; }
  .rw-top, .rw-tabs, .rw-xl { white-space:nowrap; flex:none; }
  #rw { white-space:normal; width:612px; height:339px; box-sizing:border-box; padding:7px 9px; color:#e9ecef; font:400 11px HMI, sans-serif;
        display:flex; flex-direction:column; gap:6px; user-select:none; }
  #rw button { font-family:HMI, sans-serif; cursor:pointer; }
  .rw-top { display:flex; align-items:center; gap:6px; width:100%; }
  .rw-tabs button { background:#16191d; color:#aeb3b9; border:1px solid #30343a; font-weight:700; font-size:9.5px; letter-spacing:.3px;
                    padding:5px 7px; border-radius:6px; margin-right:3px; }
  .rw-sel, #inp select, #inp input { background:#101317; color:#f2f4f6; border:1px solid #33373d; border-radius:6px; font:600 10px HMI, sans-serif;
                    padding:4px 6px; outline:none; color-scheme:dark; box-sizing:border-box; }
  .rw-sel { flex:none; height:25px; }
  #inp select:focus, #inp input:focus, .rw-sel:focus { border-color:#ff8c1a; }
  .rw-tabs button.on { background:linear-gradient(90deg,#e8121c,#8c0a10); color:#fff; border-color:#e8121c; }
  .rw-nav { flex:1 1 auto; min-width:0; display:flex; align-items:center; justify-content:center; gap:6px; }
  .rw-nav button { width:24px; height:24px; border-radius:6px; background:#16191d; color:#fff; border:1px solid #30343a; font-size:12px; line-height:1; padding:0; }
  .rw-nav button:disabled { opacity:.3; cursor:default; }
  .rw-nav span { font-weight:600; font-size:11px; min-width:128px; text-align:center; white-space:nowrap; }
  .rw-xl { background:linear-gradient(90deg,#ff8c1a,#d96a00); color:#111; border:0; border-radius:6px; font-weight:700; font-size:10.5px;
           padding:6px 10px; letter-spacing:.3px; }
  .rw-xl:disabled { opacity:.4; cursor:default; }
  .rw-stats { display:grid; grid-template-columns:repeat(6,1fr); gap:5px; }
  .rw-stat { background:#101317; border:1px solid #262a30; border-radius:7px; padding:4px 7px 3px; }
  .rw-stat b { display:block; color:#ff8c1a; font-weight:600; font-size:8.5px; letter-spacing:.3px; white-space:nowrap; }
  .rw-stat span { font:700 14.5px VAL, HMI, sans-serif; color:#fff; white-space:nowrap; }
  .rw-stat small { color:#ff8c1a; font-size:8.5px; margin-left:2px; }
  .rw-chart { height:96px; flex:none; background:#0c0f12; border:1px solid #23272c; border-radius:7px; position:relative; overflow:hidden; }
  .rw-chart svg { display:block; }
  .rw-tbl { flex:1; min-height:0; overflow:auto; border:1px solid #23272c; border-radius:7px; background:#0c0f12; }
  .rw-tbl::-webkit-scrollbar { width:6px; height:6px; } .rw-tbl::-webkit-scrollbar-thumb { background:#3a3f46; border-radius:3px; }
  .rw-tbl table { width:100%; border-collapse:collapse; font-size:10px; }
  .rw-tbl th { position:sticky; top:0; background:#181b20; color:#ff8c1a; font-weight:600; font-size:8.8px; text-align:right;
               padding:4px 5px; white-space:nowrap; }
  .rw-tbl td { padding:2.5px 5px; text-align:right; border-top:1px solid #1b1f24; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .rw-tbl th:first-child, .rw-tbl td:first-child { text-align:left; }
  .rw-tbl td.na { color:#5d636a; }
  .rw-up { color:#18d26e; } .rw-down { color:#ff6a5c; }
  /* ---------- INPUT DATA ---------- */
  #inp { white-space:normal; width:612px; height:339px; box-sizing:border-box; padding:7px 9px; color:#e9ecef; font:400 10.5px HMI, sans-serif;
         display:flex; flex-direction:column; gap:6px; }
  .in-row { display:flex; gap:7px; }
  .in-card { flex:1; background:#101317; border:1px solid #262a30; border-radius:8px; padding:6px 9px 8px;
             display:grid; grid-template-columns:78px 1fr; gap:4px 6px; align-items:center; }
  .in-card h4 { grid-column:1 / 3; margin:0 0 2px; color:#ff8c1a; font:700 10.5px HMI, sans-serif; letter-spacing:.4px; }
  .in-card label { color:#aeb3b9; font-size:9.5px; }
  .in-card input, .in-card select { width:100%; height:22px; }
  .in-btn { grid-column:1 / 3; margin-top:3px; height:26px; border:0; border-radius:6px; cursor:pointer; color:#fff;
            background:linear-gradient(90deg,#e8121c,#8c0a10); font:700 10.5px HMI, sans-serif; letter-spacing:.4px; }
  .in-btn:disabled { opacity:.5; cursor:default; }
  .in-list { flex:1; min-height:0; display:flex; flex-direction:column; background:#0c0f12; border:1px solid #23272c; border-radius:8px; }
  .in-lhead { display:flex; align-items:center; gap:8px; padding:4px 8px; border-bottom:1px solid #1b1f24; }
  .in-lhead b { color:#ff8c1a; font-size:9.5px; letter-spacing:.4px; }
  .in-lhead input { height:21px; width:122px; flex:none; }
  .in-lhead b { white-space:nowrap; }
  .in-lhead span { margin-left:auto; color:#c9ccd0; font-size:9.5px; }
  .in-ltbl { flex:1; overflow:auto; }
  .in-ltbl table { width:100%; border-collapse:collapse; font-size:10px; }
  .in-ltbl th { position:sticky; top:0; background:#181b20; color:#ff8c1a; font-weight:600; font-size:8.8px; text-align:left; padding:3px 6px; }
  .in-ltbl td { padding:2.5px 6px; border-top:1px solid #1b1f24; white-space:nowrap; }
  .in-ltbl td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .in-ltbl .tag { display:inline-block; padding:0 5px; border-radius:4px; font-size:8.5px; font-weight:700; }
  .tag-p { background:#123d27; color:#3ee08a; } .tag-m { background:#3d2a12; color:#ffae55; }
  .in-del { background:none; border:1px solid #4a2a2a; color:#ff6a5c; border-radius:5px; cursor:pointer; font-size:9px; padding:1px 6px; }
  .in-empty { color:#6c727a; text-align:center; padding:14px; }
  #inp { position:relative; }
  .in-lock { position:absolute; inset:0; z-index:5; display:none; align-items:center; justify-content:center;
             background:rgba(6,8,10,.94); border-radius:8px; }
  .in-lock.on { display:flex; }
  .in-lockbox { text-align:center; width:260px; }
  .in-lockbox h4 { margin:6px 0 2px; color:#ff8c1a; font:700 13px HMI, sans-serif; letter-spacing:.6px; }
  .in-lockbox p { margin:0 0 10px; color:#aeb3b9; font-size:10px; }
  .in-pinrow { display:flex; gap:6px; }
  .in-pinrow input { flex:1; height:30px !important; font-size:14px !important; text-align:center; letter-spacing:4px; }
  .in-pinrow .in-btn { margin:0; width:80px; height:30px; }
  .in-pinmsg { min-height:14px; margin-top:6px; color:#ff6a5c; font-size:10px; }
  @keyframes inShake { 0%,100% { transform:translateX(0) } 25% { transform:translateX(-6px) } 75% { transform:translateX(6px) } }
  .in-shake { animation:inShake .25s 2; }
  .rw-msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:#a5aab0;
            font-size:11px; padding:0 20px; }
</style>
</head>

  { id: "S4", name: "STORAGE 4", device: "TANK-04", online: false },

// Sandi untuk membuka menu INPUT DATA (khusus admin) & lama terbuka sebelum terkunci lagi

const MMT_UNITS = ["MMT 13", "MMT 18", "MMT 25", "MMT 26", "MMT 28", "MMT 39"];
/* ===================================================================== */
const SENSOR_ST = STORAGES.find(x => x.online) || STORAGES[0];   // storage yang datanya dari node
const stName = id => (STORAGES.find(x => x.id === id) || { name: id }).name;

// Tabel kalibrasi: index = SISA KOSONG (1..235 cm) -> berat (kg)
const CAL_KG = [
30666,30652,30627,30595,30556,30513,30465,30412,30356,30296,30233,30166,30097,30024,29949,29871,29791,29708,29622,29535,

 2682, 2567, 2453, 2341, 2230, 2121, 2014, 1908, 1804, 1702, 1602, 1504, 1408, 1314, 1222, 1132, 1044,  959,  876,  795,
  718,  642,  570,  500,  434,  497,  445,  397,  351,  309,  270,  234,  201,  171,  144];
const CAL_FULL_KG = CAL_KG[0];
function calWeightFromEmpty(e) {
  if (e <= 1) return CAL_KG[0];
  if (e >= 235) return CAL_KG[234];
  const lo = Math.floor(e), f = e - lo;
  const a = CAL_KG[lo - 1], b = CAL_KG[lo];
  return a + (b - a) * f;
}

// ------------------------------------------------------------ colors
const C = { WHITE:"#f2f4f6", UNIT:"#c4c8cc", SUB:"#a5aab0", DIM:"#696e74", RED:"#eb141c", GREEN:"#18d26e",
            YELLOW:"#fabe1e", BTN:"#26292e", BTNBRD:"#5a5f66", TRACK:"#3a3e44" };

// ------------------------------------------------------------ storage (aman bila diblokir)
const store = {
  get(k, d) { try { const v = localStorage.getItem("hmi_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("hmi_" + k, JSON.stringify(v)); } catch (e) {} },
};

// ------------------------------------------------------------ state
const qs = new URLSearchParams(location.search);
const DEMO = qs.has("demo");
let page = 0;
let deviceId = qs.get("device") || store.get("devId", SENSOR_ST.device);
SENSOR_ST.device = deviceId;
let viewStorage = Math.min(Math.max(+store.get("viewSt", 0) || 0, 0), STORAGES.length - 1);   // storage yang dilihat di dashboard
let alarmEnabled = store.get("alarmOn", CFG.ALARM_DEFAULT_ON);
let alarmCm = store.get("alarmCm", CFG.ALARM_DEFAULT_CM);
if (!(alarmCm >= CFG.ALARM_MIN_CM && alarmCm <= CFG.ALARM_MAX_CM)) alarmCm = CFG.ALARM_DEFAULT_CM;
let alarmActive = false, alarmSilenced = false;
const net = { hasRow:false, rowId:null, distance:0, rssi:null, rowEpoch:0, supaOk:false, supaMsg:"menunggu...", online:navigator.onLine };

// ------------------------------------------------------------ svg helpers
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
const cache = {};
function region(id, key, fn) {           // gambar ulang hanya bila berubah (mirip LCD)
  if (cache[id] === key) return;
  cache[id] = key;
  const g = $(id); g.replaceChildren(); fn(g);
}
function txt(g, s, x, y, cls, fill, anchor) {
  const t = el("text", { x, y, class: cls, fill, "text-anchor": anchor || "start" }, s);
  g.appendChild(t); return t;
}
function measure(s, cls) {
  const t = el("text", { x: -999, y: -999, class: cls }, s);
  $("stage").appendChild(t); const w = t.getComputedTextLength(); t.remove(); return w;
}

// ------------------------------------------------------------ format
const fmt1 = v => v.toFixed(1);
function fmtKg(v) {
  let x = Math.round(v); if (x < 0) x = 0;
  return String(x).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}
function fmtAge(s) {
  if (s < 0) return "-";
  if (s < 60) return s + " dtk";
  if (s < 3600) return Math.floor(s / 60) + " mnt";
  if (s < 86400) return Math.floor(s / 3600) + " jam";
  return Math.floor(s / 86400) + " hari";
}
function wibTime(epochMs) {
  const d = new Date(epochMs + 7 * 3600e3);
  const p = n => String(n).padStart(2, "0");
  return p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) + ":" + p(d.getUTCSeconds());
}

// ------------------------------------------------------------ build state (sama dengan buildState() LCD)
function buildState() {
  const s = { hasData: net.hasRow, ageSec: -1 };
  if (net.hasRow) {
    s.ageSec = Math.max(0, Math.floor((Date.now() - net.rowEpoch) / 1000));
    s.online = s.ageSec <= CFG.STALE_S;
    s.updTime = net.rowEpoch ? wibTime(net.rowEpoch) : "";
    s.jsn = net.distance;
    s.sensorError = net.distance < CFG.JSN_MIN_VALID_CM;
    let e = net.distance - CFG.SENSOR_OFFSET_CM;
    e = Math.min(Math.max(e, 0), CFG.TANK_HEIGHT_CM);
    s.empty = e;
    s.level = CFG.TANK_HEIGHT_CM - e;
    s.kg = calWeightFromEmpty(e);
    s.pct = s.kg / CAL_FULL_KG * 100;
  }
  const valid = s.hasData && s.online && !s.sensorError;
  if (!alarmEnabled || !valid) alarmActive = false;
  else if (!alarmActive && s.empty <= alarmCm) alarmActive = true;
  else if (alarmActive && s.empty > alarmCm + CFG.ALARM_HYST_CM) alarmActive = false;
  if (!alarmActive) alarmSilenced = false;
  Object.assign(s, {
    alarmEnabled, alarmActive, alarmSilenced, alarmCm,
    alarmSensorCm: alarmCm + CFG.SENSOR_OFFSET_CM,
    alarmKg: calWeightFromEmpty(alarmCm),
    blink: Math.floor(Date.now() / 500) % 2 === 1,
  });
  return s;
}

function wrap(g, s, x, base, maxW, lineH, cls, fill, maxLines) {
  const words = s.split(" "); let line = "", n = 0;
  for (let i = 0; i < words.length && n < maxLines; i++) {
    const test = line ? line + " " + words[i] : words[i];
    if (line && measure(test, cls) > maxW) { txt(g, line, x, base + n * lineH, cls, fill); n++; line = words[i]; }

  }
  if (line && n < maxLines) txt(g, line, x, base + n * lineH, cls, fill);
}

// ============================================================ SUPABASE
let fetching = false;
async function fetchSupabase() {
  if (DEMO) return demoFetch();
  if (fetching) return; fetching = true;
  const url = `${CFG.SUPABASE_URL}/rest/v1/${CFG.TABLE}?select=id,distance_cm,rssi,created_at&device_id=eq.${encodeURIComponent(deviceId)}&order=id.desc&limit=1`;
  const headers = { apikey: CFG.SUPABASE_KEY, Accept: "application/json" };
  if (CFG.SUPABASE_KEY.startsWith("eyJ")) headers.Authorization = "Bearer " + CFG.SUPABASE_KEY;
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 6000);
  try {
    const r = await fetch(url, { headers, cache: "no-store", signal: ctrl.signal });
    if (!r.ok) {
      let m = "HTTP " + r.status;
      if (r.status === 401 || r.status === 403) m = `HTTP ${r.status} cek key/RLS`;
      else if (r.status === 404) m = "HTTP 404 cek tabel";
      setSupa(false, m);
      return;
    }
    const arr = await r.json();
    if (!Array.isArray(arr)) return setSupa(false, "JSON tidak valid");
    if (!arr.length) { net.hasRow = false; return setSupa(false, "belum ada data"); }
    const row = arr[0];
    net.hasRow = true; net.rowId = row.id;
    net.distance = row.distance_cm == null ? -1 : Number(row.distance_cm);
    net.rssi = row.rssi == null ? null : Math.round(row.rssi);
    net.rowEpoch = Date.parse(row.created_at) || Date.now();
    setSupa(true, "OK");
  } catch (e) {
    setSupa(false, e.name === "AbortError" ? "timeout" : "koneksi gagal");
  } finally { clearTimeout(to); fetching = false; }
}
function setSupa(ok, m) { net.supaOk = ok; net.supaMsg = m; }

}

let actx = null;
function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {} }
document.addEventListener("pointerdown", unlockAudio);
let lastBeepPhase = null;
function beep(s) {
  const on = s.alarmActive && !s.alarmSilenced && s.blink;
  if (on === lastBeepPhase) return; lastBeepPhase = on;
  if (!on || !actx || actx.state !== "running") return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = "square"; o.frequency.value = 2200; g.gain.value = 0.05;
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.4);
}

// ============================================================ RIWAYAT & INPUT DATA
// Sumber data:
//   tank_hourly    = ringkasan sensor per jam (otomatis dari node)        -> supabase_riwayat.sql
//   production_log = produksi harian (input manual operator)              -> supabase_input.sql
//   mmt_fill       = pengisian emulsion ke MMT (input manual operator)    -> supabase_input.sql
// Rumus: TERPAKAI = STOK AWAL + PRODUKSI - STOK AKHIR
const H7 = 7 * 3600e3, HOUR = 3600e3, DAY = 86400e3;
const HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
const BLN = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
const BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
const MODE_NAME = { day: "Harian", week: "Mingguan", month: "Bulanan" };
const W = ms => new Date(ms + H7);                      // jam dinding WIB (pakai getUTC*)
const p2 = n => String(n).padStart(2, "0");
const dstr = ms => { const w = W(ms); return `${w.getUTCFullYear()}-${p2(w.getUTCMonth() + 1)}-${p2(w.getUTCDate())}`; };   // YYYY-MM-DD (WIB)
const dParse = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) - H7; };                   // awal hari WIB
const dtLocal = ms => { const w = W(ms); return `${dstr(ms)}T${p2(w.getUTCHours())}:${p2(w.getUTCMinutes())}`; };
const dtParse = s => { const [d, hm] = s.split("T"); const [h, mi] = hm.split(":").map(Number); return dParse(d) + h * HOUR + mi * 60000; };
const fmtHour = t => `${p2(W(t).getUTCHours())}:00`;
const fmtDay = t => { const w = W(t); return `${HARI[w.getUTCDay()].slice(0, 3)}, ${p2(w.getUTCDate())} ${BLN[w.getUTCMonth()]}`; };
const fmtHM = t => { const w = W(t); return `${p2(w.getUTCHours())}:${p2(w.getUTCMinutes())}`; };
const fmtTon = v => (Math.round(v * 1000) / 1000).toLocaleString("id-ID", { maximumFractionDigits: 3 });
const emptyOf = d => Math.min(Math.max(d - CFG.SENSOR_OFFSET_CM, 0), CFG.TANK_HEIGHT_CM);
const kgOf = d => calWeightFromEmpty(emptyOf(d));       // rumus sama dengan dashboard / LCD

// ---------------------------------------------------------------- akses Supabase
function sbHeaders(extra) {
  const h = Object.assign({ apikey: CFG.SUPABASE_KEY, Accept: "application/json" }, extra || {});
  if (CFG.SUPABASE_KEY.startsWith("eyJ")) h.Authorization = "Bearer " + CFG.SUPABASE_KEY;
  return h;
}
async function sbFail(r, table, sqlFile) {
  let body = ""; try { body = await r.text(); } catch (x) {}
  if (r.status === 404 || /PGRST205|42P01|does not exist/.test(body))
    return new Error(`Tabel ${table} belum ada di Supabase. Jalankan ${sqlFile} di SQL Editor (sekali saja).`);
  if (r.status === 401 || r.status === 403) return new Error(`HTTP ${r.status}: cek key / izin (RLS) tabel ${table}.`);
  return new Error(`Gagal (${table}) HTTP ${r.status}`);
}
async function sbGet(table, query, sqlFile) {
  const r = await fetch(`${CFG.SUPABASE_URL}/rest/v1/${table}?${query}`, { headers: sbHeaders(), cache: "no-store" });
  if (!r.ok) throw await sbFail(r, table, sqlFile);
  return r.json();
}

    MMT_UNITS.slice(0, 3 + (d % 3)).forEach((u, i) => DEMO_MAN.mmt.push({ id: DEMO_MAN.id++, waktu: new Date(t + (7 + i * 2) * HOUR).toISOString(),
      mmt: u, storage: i % 4 === 3 ? "S2" : "S1", ton: 6 + i * 1.25, catatan: "", created_at: new Date(t + (7 + i * 2) * HOUR).toISOString() }));

async function manProd(fromDay, toDayExcl) {             // tanggal "YYYY-MM-DD"
  if (DEMO) return DEMO_MAN.prod.filter(x => x.tanggal >= fromDay && x.tanggal < toDayExcl).map(x => ({ ...x })).sort((a, b) => a.tanggal < b.tanggal ? -1 : a.tanggal > b.tanggal ? 1 : a.id - b.id);
  return sbGet("production_log", `select=*&tanggal=gte.${fromDay}&tanggal=lt.${toDayExcl}&order=tanggal.asc,id.asc`, "supabase_input.sql");
}
async function manMmt(s, e) {
  if (DEMO) return DEMO_MAN.mmt.filter(x => Date.parse(x.waktu) >= s && Date.parse(x.waktu) < e).map(x => ({ ...x })).sort((a, b) => Date.parse(a.waktu) - Date.parse(b.waktu));
  return sbGet("mmt_fill", `select=*&waktu=gte.${new Date(s).toISOString()}&waktu=lt.${new Date(e).toISOString()}&order=waktu.asc`, "supabase_input.sql");
}
async function manInsert(table, row) {
  if (DEMO) { const r = { id: DEMO_MAN.id++, created_at: new Date().toISOString(), ...row }; (table === "production_log" ? DEMO_MAN.prod : DEMO_MAN.mmt).push(r); return r; }
  const r = await fetch(`${CFG.SUPABASE_URL}/rest/v1/${table}`, { method: "POST", body: JSON.stringify(row),
    headers: sbHeaders({ "Content-Type": "application/json", Prefer: "return=representation" }) });
  if (!r.ok) throw await sbFail(r, table, "supabase_input.sql");
  return (await r.json())[0];
}
async function manDelete(table, id) {
  if (DEMO) { const a = table === "production_log" ? DEMO_MAN.prod : DEMO_MAN.mmt; const i = a.findIndex(x => x.id === id); if (i >= 0) a.splice(i, 1); return; }
  const r = await fetch(`${CFG.SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, { method: "DELETE", headers: sbHeaders({ Prefer: "return=minimal" }) });
  if (!r.ok) throw await sbFail(r, table, "supabase_input.sql");
}
// ---- data sensor per jam
async function hourlyRows(device, s, e) {
  let rows;
  if (DEMO) rows = rwDemo(s, e);
  else rows = await sbGet("tank_hourly", `select=hour,n,d_sum,d_min,d_max,d_first,first_at,d_last,last_at&device_id=eq.${encodeURIComponent(device)}` +
    `&hour=gte.${new Date(s).toISOString()}&hour=lt.${new Date(e).toISOString()}&order=hour.asc&limit=2000`, "supabase_riwayat.sql");
  return rows.map(x => ({ t: Date.parse(x.hour), n: +x.n, sum: +x.d_sum, dmin: +x.d_min, dmax: +x.d_max,
    dfirst: +x.d_first, tfirst: Date.parse(x.first_at), dlast: +x.d_last, tlast: Date.parse(x.last_at) }));
}
function rwDemo(s, e) {                                  // data sensor simulasi untuk ?demo
  const out = [];
  for (let t = s; t < Math.min(e, Date.now()); t += HOUR) {
    const f = h => 100 + 70 * Math.sin(h / 30) + 25 * Math.sin(h / 5);
    const h = (t - Date.UTC(2026, 0, 1)) / HOUR, d0 = f(h), d1 = f(h + 1);
    out.push({ hour: new Date(t).toISOString(), n: 720, d_sum: 720 * (d0 + d1) / 2, d_min: Math.min(d0, d1) - 1, d_max: Math.max(d0, d1) + 1,
               d_first: d0, first_at: new Date(t + 2000).toISOString(), d_last: d1, last_at: new Date(t + HOUR - 3000).toISOString() });
  }
  return out;
}

// ---------------------------------------------------------------- perhitungan stok
function rwAgg(list) {
  if (!list || !list.length) return null;
  let n = 0, sum = 0, dmin = Infinity, dmax = -Infinity, f = list[0], l = list[0];
  for (const r of list) {
    n += r.n; sum += r.sum; dmin = Math.min(dmin, r.dmin); dmax = Math.max(dmax, r.dmax);
    if (r.tfirst < f.tfirst) f = r; if (r.tlast > l.tlast) l = r;
  }
  const davg = sum / n;
  return { n, davg, awal: kgOf(f.dfirst), akhir: kgOf(l.dlast), rata: kgOf(davg), min: kgOf(dmax), max: kgOf(dmin),
           level: CFG.TANK_HEIGHT_CM - emptyOf(davg), space: emptyOf(davg), pct: kgOf(davg) / CAL_FULL_KG * 100 };
}
// stok satu storage pada rentang [a,b): sensor + produksi + isi MMT (kg)
function stockOf(st, rows, prod, mmt, a, b) {
  const ag = st.online ? rwAgg(rows.filter(r => r.t >= a && r.t < b)) : null;
  // produksi dicatat per HARI -> hanya dihitung jika rentang minimal 1 hari
  const pk = b - a >= DAY ? prod.filter(x => x.storage === st.id && x.tanggal >= dstr(a) && x.tanggal <= dstr(b - 1)).reduce((s, x) => s + +x.ton * 1000, 0) : 0;
  const mk = mmt.filter(x => x.storage === st.id && Date.parse(x.waktu) >= a && Date.parse(x.waktu) < b).reduce((s, x) => s + +x.ton * 1000, 0);
  // rentang < 1 hari (baris per jam): produksi tidak diketahui -> terpakai = penurunan stok saja
  const terpakai = !ag ? null : b - a >= DAY ? ag.awal + pk - ag.akhir : Math.max(0, ag.awal - ag.akhir);
  return { ag, prod: pk, mmt: mk, awal: ag ? ag.awal : null, akhir: ag ? ag.akhir : null, terpakai };
}

// ================================================================ HALAMAN RIWAYAT
const rw = { mode: "day", anchor: Date.now(), st: 0, rows: [], prod: [], mmt: [], loading: false, err: "", range: [0, 0], loadedAt: 0 };
function rwRange(mode, a) {
  const w = W(a), y = w.getUTCFullYear(), m = w.getUTCMonth(), d = w.getUTCDate();
  if (mode === "day") { const s = Date.UTC(y, m, d) - H7; return [s, s + DAY]; }
  if (mode === "week") { const dow = (w.getUTCDay() + 6) % 7; const s = Date.UTC(y, m, d - dow) - H7; return [s, s + 7 * DAY]; }
  return [Date.UTC(y, m, 1) - H7, Date.UTC(y, m + 1, 1) - H7];
}
function rwLabel(mode, [s, e]) {
  const a = W(s), b = W(e - 1);
  if (mode === "day") return `${HARI[a.getUTCDay()]}, ${p2(a.getUTCDate())} ${BLN[a.getUTCMonth()]} ${a.getUTCFullYear()}`;
  if (mode === "week") return `${p2(a.getUTCDate())} ${BLN[a.getUTCMonth()]} – ${p2(b.getUTCDate())} ${BLN[b.getUTCMonth()]} ${b.getUTCFullYear()}`;
  return `${BULAN[a.getUTCMonth()]} ${a.getUTCFullYear()}`;
}
function rwBuckets(st, rows) {                          // per jam (harian) / per hari (mingguan, bulanan)
  const [s, e] = rw.range, step = rw.mode === "day" ? HOUR : DAY, out = [];
  for (let t = s; t < e; t += step) out.push({ t, label: step === HOUR ? fmtHour(t) : fmtDay(t), k: stockOf(st, rows, rw.prod, rw.mmt, t, t + step) });
  return out;
}
const kgS = v => v == null ? "---" : fmtKg(v);
const sgn = v => v == null ? "---" : (v >= 0 ? "" : "−") + fmtKg(Math.abs(v));
function rwRender() {
  const [s, e] = rw.range, now = Date.now(), st = STORAGES[rw.st];
  $("rwLabel").textContent = rwLabel(rw.mode, rw.range);
  $("rwNext").disabled = e > now;
  document.querySelectorAll(".rw-tabs button").forEach(b => b.classList.toggle("on", b.dataset.m === rw.mode));
  $("rwXl").disabled = rw.loading || !!rw.err;
  const k = stockOf(st, rw.rows, rw.prod, rw.mmt, s, e);
  const chip = (lbl, v, u, cls) => `<div class="rw-stat"><b>${lbl}</b><span class="${cls || ""}">${v}</span><small>${u}</small></div>`;
  $("rwStats").innerHTML = chip("STOK AWAL", kgS(k.awal), "kg") + chip("PRODUKSI", fmtKg(k.prod), "kg", "rw-up") +
    chip("TERPAKAI", sgn(k.terpakai), "kg", "rw-down") + chip("STOK AKHIR", kgS(k.akhir), "kg") +
    chip("ISI KE MMT", fmtKg(k.mmt), "kg") + chip("RATA-RATA", kgS(k.ag && k.ag.rata), "kg");
  rwChart(st, k.ag);
  if (rw.loading || rw.err) { $("rwTbl").innerHTML = ""; return; }
  const B = rwBuckets(st, rw.rows);
  const th = `<tr><th>${rw.mode === "day" ? "JAM" : "TANGGAL"}</th><th>STOK AWAL</th><th>PRODUKSI</th><th>TERPAKAI</th><th>STOK AKHIR</th>
    <th>ISI MMT</th><th>RATA²</th><th>MIN</th><th>MAKS</th><th>LEVEL cm</th></tr>`;
  const rows = B.map(b => {
    const q = b.k, a = q.ag, fut = b.t > now;
    if (fut) return `<tr><td>${b.label}</td><td class="na" colspan="9"></td></tr>`;
    return `<tr><td>${b.label}</td><td class="${a ? "" : "na"}">${kgS(q.awal)}</td><td>${q.prod ? fmtKg(q.prod) : "-"}</td>
      <td class="${q.terpakai == null ? "na" : ""}">${sgn(q.terpakai)}</td><td class="${a ? "" : "na"}">${kgS(q.akhir)}</td>
      <td>${q.mmt ? fmtKg(q.mmt) : "-"}</td><td class="${a ? "" : "na"}">${kgS(a && a.rata)}</td><td class="${a ? "" : "na"}">${kgS(a && a.min)}</td>
      <td class="${a ? "" : "na"}">${kgS(a && a.max)}</td><td class="${a ? "" : "na"}">${a ? fmt1(a.level) : "---"}</td></tr>`;
  }).join("");
  $("rwTbl").innerHTML = `<table>${th}${rows}</table>`;
}
function rwChart(st, tot) {
  const box = $("rwChart"), Wd = 594, Hd = 94, L = 44, R = 8, T = 8, Bt = 16;
  const [s, e] = rw.range;
  const msg = rw.loading ? "Memuat riwayat..." : rw.err ? rw.err
    : !st.online ? `${st.name} OFFLINE — node sensor belum terpasang. Produksi & pengisian MMT tetap tercatat.`
    : !tot ? "Belum ada data sensor pada periode ini." : "";
  if (msg) { box.innerHTML = `<div class="rw-msg">${msg}</div>`; return; }
  const pts = rw.rows.map(r => ({ t: r.t + HOUR / 2, v: kgOf(r.sum / r.n) }));
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if (hi - lo < 500) { const m = (hi + lo) / 2; lo = m - 250; hi = m + 250; }
  const pad = (hi - lo) * 0.1; lo = Math.max(0, lo - pad); hi = hi + pad;
  const X = t => L + (t - s) / (e - s) * (Wd - L - R), Y = v => T + (1 - (v - lo) / (hi - lo)) * (Hd - T - Bt);
  let grid = "", xl = "";
  for (let i = 0; i <= 2; i++) {
    const v = lo + (hi - lo) * i / 2, y = Y(v);
    grid += `<line x1="${L}" x2="${Wd - R}" y1="${y}" y2="${y}" stroke="#20252b"/><text x="${L - 4}" y="${y + 3}" fill="#7b8189" font-size="8" text-anchor="end">${fmtKg(v)}</text>`;
  }
  const ticks = [];
  if (rw.mode === "day") for (let h = 0; h <= 24; h += 6) ticks.push([s + h * HOUR, p2(h) + ":00"]);
  else if (rw.mode === "week") for (let d = 0; d < 7; d++) ticks.push([s + d * DAY + DAY / 2, HARI[W(s + d * DAY).getUTCDay()].slice(0, 3)]);
  else for (let d = 0; s + d * DAY < e; d += 5) ticks.push([s + d * DAY + DAY / 2, String(d + 1)]);
  for (const [t, lb] of ticks) { const x = Math.min(X(t), Wd - R - 2); xl += `<text x="${x}" y="${Hd - 4}" fill="#7b8189" font-size="8" text-anchor="${x < X(t) ? "end" : "middle"}">${lb}</text>`; }
  let path = "", area = "", seg = [];
  const P = p => `${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`;
  const flush = () => { if (!seg.length) return; path += "M" + seg.map(P).join("L");
    area += `M${X(seg[0].t).toFixed(1)},${Hd - Bt}L` + seg.map(P).join("L") + `L${X(seg[seg.length - 1].t).toFixed(1)},${Hd - Bt}Z`; seg = []; };
  pts.forEach((p, i) => { if (i && p.t - pts[i - 1].t > HOUR * 1.5) flush(); seg.push(p); }); flush();
  box.innerHTML = `<svg width="${Wd}" height="${Hd}" viewBox="0 0 ${Wd} ${Hd}">

                      x.created_at ? T(xd(Date.parse(x.created_at)), 4) : dash])] });

  const blob = new Blob([xlsxBuild(sheets)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `Laporan_Emulsion_${per}_${tag}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
