  :root { --bg:#000; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family:HMI, system-ui, sans-serif;
         -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  #stage { width:100vw; height:calc(100vw * 0.6); max-height:100vh; max-width:calc(100vh / 0.6); display:block; }
  .big   { font:600 39px HMI, sans-serif; }
  .unit  { font:500 19px HMI, sans-serif; }
  .med   { font:600 22px HMI, sans-serif; }
  .btn   { font:700 14px HMI, sans-serif; letter-spacing:.2px; }
  .field { font:500 16px HMI, sans-serif; }
  .body  { font:400 12.5px HMI, sans-serif; }
  .small { font:400 11.5px HMI, sans-serif; }
  .hd    { font:600 15px HMI, sans-serif; }
  .hit   { fill:transparent; cursor:pointer; }
  .hit:hover { fill:rgba(255,255,255,.04); }
  .page  { display:none; }
  .page.on { display:inline; }
  foreignObject input { width:100%; height:100%; box-sizing:border-box; background:transparent; border:0; outline:0;
         color:#f2f4f6; font:500 16px HMI, sans-serif; padding:0 0 0 6px; }
  #toast { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:rgba(20,22,26,.95);
           color:#f2f4f6; border:1px solid #3c4046; border-radius:10px; padding:8px 14px; font:500 13px HMI, sans-serif;
           opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.on { opacity:1; }
</style>

<script>
/* =====================================================================
   SMART MONITORING EMULSION STOCK — Web HMI
   Alur: Sensor JSN -> ESP32-C3 -> Supabase (tank_readings) -> Web ini
   Logika & rumus sama persis dengan LCD HMI (config.h / calibration.h)
   ===================================================================== */
const CFG = {
  SUPABASE_URL: "https://rczihhduxywzcwhtphbw.supabase.co",
  SUPABASE_KEY: "sb_publishable_BnzsEVG8ajJYL1ksPJsOSg_G5bntZEl",
  TABLE: "tank_readings",
  DEVICE_ID: "TANK-01",
  POLL_MS: 3000,          // ambil data tiap 3 detik
  STALE_S: 60,            // >60 dtk tanpa data baru = OFFLINE
  SENSOR_OFFSET_CM: 20,   // jarak sensor ke titik 0 tabel
  TANK_HEIGHT_CM: 235,
  JSN_MIN_VALID_CM: 1,
  ALARM_DEFAULT_ON: true,
  ALARM_DEFAULT_CM: 10,
  ALARM_STEP_CM: 1, ALARM_MIN_CM: 1, ALARM_MAX_CM: 200, ALARM_HYST_CM: 1,
};

// Tabel kalibrasi: index = SISA KOSONG (1..235 cm) -> berat (kg)
const CAL_KG = [
30666,30652,30627,30595,30556,30513,30465,30412,30356,30296,30233,30166,30097,30024,29949,29871,29791,29708,29622,29535,
29445,29353,29259,29162,29064,28964,28862,28758,28653,28546,28437,28326,28214,28100,27984,27868,27749,27629,27508,27386,
27262,27137,27010,26882,26753,26623,26492,26359,26225,26091,25955,25818,25680,25541,25401,25260,25118,24975,24831,24686,
24541,24394,24247,24099,23950,23800,23650,23499,23347,23194,23041,22887,22732,22577,22421,22264,22107,21949,21791,21632,
21473,21313,21152,20992,20830,20668,20506,20343,20180,20017,19853,19689,19524,19359,19194,19028,18862,18696,18529,18363,
18196,18029,17861,17694,17526,17358,17190,17021,16853,16684,16516,16347,16178,16009,15840,15671,15502,15333,15164,14995,
14826,14657,14488,14320,14151,13982,13814,13645,13477,13309,13141,12973,12805,12638,12471,12304,12137,11971,11804,11638,
11473,11308,11143,10978,10814,10650,10486,10323,10160, 9998, 9836, 9675, 9514, 9354, 9194, 9034, 8875, 8717, 8559, 8402,
 8246, 8090, 7934, 7780, 7626, 7472, 7320, 7168, 7017, 6866, 6717, 6568, 6420, 6272, 6126, 5980, 5836, 5692, 5549, 5407,
 5266, 5126, 4987, 4849, 4712, 4576, 4441, 4307, 4175, 4043, 3913, 3784, 3656, 3530, 3405, 3281, 3158, 3037, 2917, 2799,
 2682, 2567, 2453, 2341, 2230, 2121, 2014, 1908, 1804, 1702, 1602, 1504, 1408, 1314, 1222, 1132, 1044,  959,  876,  795,
  718,  642,  570,  500,  434,  497,  445,  397,  351,  309,  270,  234,  201,  171,  144];
const CAL_FULL_KG = CAL_KG[0];
function calWeightFromEmpty(e) {
  if (e <= 1) return CAL_KG[0];
  if (e >= 235) return CAL_KG[234];
  const lo = Math.floor(e), f = e - lo;
  const a = CAL_KG[lo - 1], b = CAL_KG[lo];
  return a + (b - a) * f;
}

// ------------------------------------------------------------ colors
const C = { WHITE:"#f2f4f6", UNIT:"#c4c8cc", SUB:"#a5aab0", DIM:"#696e74", RED:"#eb141c", GREEN:"#18d26e",
            YELLOW:"#fabe1e", BTN:"#26292e", BTNBRD:"#5a5f66", TRACK:"#3a3e44" };

// ------------------------------------------------------------ storage (aman bila diblokir)
const store = {
  get(k, d) { try { const v = localStorage.getItem("hmi_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("hmi_" + k, JSON.stringify(v)); } catch (e) {} },
};

// ------------------------------------------------------------ state
const qs = new URLSearchParams(location.search);
const DEMO = qs.has("demo");
let page = 0;
let deviceId = qs.get("device") || store.get("devId", CFG.DEVICE_ID);
let alarmEnabled = store.get("alarmOn", CFG.ALARM_DEFAULT_ON);
let alarmCm = store.get("alarmCm", CFG.ALARM_DEFAULT_CM);
if (!(alarmCm >= CFG.ALARM_MIN_CM && alarmCm <= CFG.ALARM_MAX_CM)) alarmCm = CFG.ALARM_DEFAULT_CM;
let alarmActive = false, alarmSilenced = false;
const net = { hasRow:false, rowId:null, distance:0, rssi:null, rowEpoch:0, supaOk:false, supaMsg:"menunggu...", online:navigator.onLine };

// ------------------------------------------------------------ svg helpers
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
const cache = {};
function region(id, key, fn) {           // gambar ulang hanya bila berubah (mirip LCD)
  if (cache[id] === key) return;
  cache[id] = key;
  const g = $(id); g.replaceChildren(); fn(g);
}
function txt(g, s, x, y, cls, fill, anchor) {
  const t = el("text", { x, y, class: cls, fill, "text-anchor": anchor || "start" }, s);
  g.appendChild(t); return t;
}
function measure(s, cls) {
  const t = el("text", { x: -999, y: -999, class: cls }, s);
  $("stage").appendChild(t); const w = t.getComputedTextLength(); t.remove(); return w;
}

// ------------------------------------------------------------ format
const fmt1 = v => v.toFixed(1);
function fmtKg(v) {
  let x = Math.round(v); if (x < 0) x = 0;
  return String(x).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}
function fmtAge(s) {
  if (s < 0) return "-";
  if (s < 60) return s + " dtk";
  if (s < 3600) return Math.floor(s / 60) + " mnt";
  if (s < 86400) return Math.floor(s / 3600) + " jam";
  return Math.floor(s / 86400) + " hari";
}
function wibTime(epochMs) {
  const d = new Date(epochMs + 7 * 3600e3);
  const p = n => String(n).padStart(2, "0");
  return p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) + ":" + p(d.getUTCSeconds());
}

// ------------------------------------------------------------ build state (sama dengan buildState() LCD)
function buildState() {
  const s = { hasData: net.hasRow, ageSec: -1 };
  if (net.hasRow) {
    s.ageSec = Math.max(0, Math.floor((Date.now() - net.rowEpoch) / 1000));
    s.online = s.ageSec <= CFG.STALE_S;
    s.updTime = net.rowEpoch ? wibTime(net.rowEpoch) : "";
    s.jsn = net.distance;
    s.sensorError = net.distance < CFG.JSN_MIN_VALID_CM;
    let e = net.distance - CFG.SENSOR_OFFSET_CM;
    e = Math.min(Math.max(e, 0), CFG.TANK_HEIGHT_CM);
    s.empty = e;
    s.level = CFG.TANK_HEIGHT_CM - e;
    s.kg = calWeightFromEmpty(e);
    s.pct = s.kg / CAL_FULL_KG * 100;
  }
  const valid = s.hasData && s.online && !s.sensorError;
  if (!alarmEnabled || !valid) alarmActive = false;
  else if (!alarmActive && s.empty <= alarmCm) alarmActive = true;
  else if (alarmActive && s.empty > alarmCm + CFG.ALARM_HYST_CM) alarmActive = false;
  if (!alarmActive) alarmSilenced = false;
  Object.assign(s, {
    alarmEnabled, alarmActive, alarmSilenced, alarmCm,
    alarmSensorCm: alarmCm + CFG.SENSOR_OFFSET_CM,
    alarmKg: calWeightFromEmpty(alarmCm),
    blink: Math.floor(Date.now() / 500) % 2 === 1,
  });
  return s;
}

// ============================================================ DASHBOARD
function drawValueCard(i, base, val, unit, col) {
  region("dc" + i, val + "|" + unit + "|" + col, g => {
    txt(g, val, 602, base, "big", col);
    txt(g, unit, 766, base, "unit", C.UNIT, "end");
  });
}
function statusMsg(s) {
  if (!net.online) return [C.RED, "INTERNET TERPUTUS"];
  if (!s.hasData) return [C.YELLOW, "SUPABASE: " + net.supaMsg];
  if (!net.supaOk) return [C.YELLOW, "SUPABASE: " + net.supaMsg];
  if (s.sensorError) return [C.RED, "SENSOR ERROR - cek JSN"];
  if (s.online) return [C.GREEN, s.updTime ? "SENSOR ONLINE\u00a0\u00a0-\u00a0\u00a0update " + s.updTime + " WIB" : "SENSOR ONLINE"];
  return [C.RED, "SENSOR OFFLINE\u00a0\u00a0-\u00a0\u00a0data " + fmtAge(s.ageSec) + " lalu"];
}
function drawDashboard(s) {
  let v, col = s.online ? C.WHITE : C.DIM, pcol = col;
  if (!s.hasData || s.sensorError) {
    v = ["---", "---", "---", "---", s.sensorError ? "ERR" : "---"];
    col = pcol = C.DIM;
  } else {
    v = [fmt1(s.level), fmtKg(s.kg), String(Math.round(s.pct)), fmt1(s.empty), fmt1(s.jsn)];
    if (s.online) { if (s.alarmActive) pcol = C.RED; else if (s.pct < 10) pcol = C.YELLOW; }
  }
  const jcol = s.sensorError ? C.RED : col;
  drawValueCard(0, 151, v[0], "cm", col);
  drawValueCard(1, 224, v[1], "kg", col);
  drawValueCard(2, 297, v[2], "%", pcol);
  drawValueCard(3, 369, v[3], "cm", col);
  drawValueCard(4, 441, v[4], "cm", jcol);

  const [dot, msg] = statusMsg(s);
  const showAlarm = s.alarmActive && !s.alarmSilenced;
  const key = [msg, dot, showAlarm, showAlarm && s.blink, s.alarmSilenced && s.alarmActive].join("|");
  region("dStatus", key, g => {
    const tw = measure(msg, "small");
    g.appendChild(el("rect", { x: 182, y: 90, width: tw + 28, height: 20, rx: 10, fill: "rgba(8,9,11,.84)", stroke: "#3c4046", "stroke-width": 1 }));
    g.appendChild(el("circle", { cx: 193, cy: 100, r: 4, fill: dot }));
    txt(g, msg, 202, 104, "small", C.SUB);
    if (showAlarm) {
      g.appendChild(el("rect", { x: 424, y: 90, width: 80, height: 20, rx: 10, fill: s.blink ? C.RED : "#780a0e" }));
      txt(g, "ALARM!", 464, 105, "btn", C.WHITE, "middle");
    } else if (s.alarmActive && s.alarmSilenced) {
      g.appendChild(el("rect", { x: 424.6, y: 90.6, width: 78.8, height: 18.8, rx: 9.4, fill: "none", stroke: C.RED, "stroke-width": 1.2 }));
      txt(g, "SENYAP", 464, 104, "small", C.RED, "middle");
    }
  });
}

// ============================================================ ALARM
function drawAlarm(s) {
  region("aToggle", String(s.alarmEnabled), g => {
    const px = 651, py = 135, pw = 72, ph = 36;
    if (s.alarmEnabled) {
      g.appendChild(el("rect", { x: px, y: py, width: pw, height: ph, rx: ph / 2, fill: "#c81018" }));
      g.appendChild(el("rect", { x: px + 2, y: py + 2, width: pw - 4, height: ph / 2 - 2, rx: ph / 4, fill: "#e1282e" }));
      g.appendChild(el("circle", { cx: px + pw - ph / 2, cy: py + ph / 2, r: 13.5, fill: C.WHITE }));
    } else {
      g.appendChild(el("rect", { x: px, y: py, width: pw, height: ph, rx: ph / 2, fill: C.TRACK }));
      g.appendChild(el("circle", { cx: px + ph / 2, cy: py + ph / 2, r: 13.5, fill: "#c8ccd0" }));
    }
    txt(g, s.alarmEnabled ? "ON" : "OFF", 752, 162, "med", s.alarmEnabled ? C.WHITE : C.SUB, "middle");
  });

  let st, sc;
  if (!s.alarmEnabled) { st = "NONAKTIF"; sc = C.DIM; }
  else if (!s.hasData || !s.online) { st = "MENUNGGU DATA"; sc = C.YELLOW; }
  else if (s.alarmActive && s.alarmSilenced) { st = "SENYAP"; sc = C.RED; }
  else if (s.alarmActive) { st = s.blink ? "BERBUNYI!" : ""; sc = C.RED; }
  else { st = "NORMAL"; sc = C.GREEN; }
  region("aState", st + "|" + sc, g => {
    if (st) { g.appendChild(el("circle", { cx: 569, cy: 159, r: 3.5, fill: sc })); txt(g, st, 577, 163, "small", sc); }
  });

  const a = fmt1(s.alarmCm), b = fmt1(s.alarmSensorCm);
  region("aLimit", a + "|" + b, g => {
    const t = txt(g, a, 572, 247, "big", C.WHITE);
    txt(g, "cm", 572 + t.getComputedTextLength() + 10, 247, "unit", C.UNIT);
    txt(g, "( " + b + " cm dari sensor )", 573, 264, "body", C.SUB);
    for (let k = 0; k < 2; k++) {
      const bx = 708 + k * 36, by = 218;
      g.appendChild(el("rect", { x: bx, y: by, width: 32, height: 30, rx: 7, fill: C.BTN, stroke: C.BTNBRD, "stroke-width": 1.2 }));
      txt(g, k ? "+" : "-", bx + 16, by + 22, "med", C.WHITE, "middle");
    }
  });

  const kg = fmtKg(s.alarmKg);
  region("aKg", kg, g => {
    const t = txt(g, kg, 572, 338, "big", C.WHITE);
    txt(g, "kg", 572 + t.getComputedTextLength() + 12, 338, "unit", C.UNIT);
  });

  const info = s.alarmEnabled
    ? `Alarm akan aktif ketika sisa ruang kosong mencapai ${a} cm dari atas tangki ( ${b} cm dari sensor ) dengan berat ±${kg} kg.`
    : `Alarm sedang NONAKTIF. Tekan tombol ON/OFF untuk mengaktifkan. Batas: ${a} cm ( ${b} cm dari sensor ), ±${kg} kg.`;
  region("aInfo", info, g => wrap(g, info, 540, 378, 228, 17, "body", "#d7dade", 4));
}
function wrap(g, s, x, base, maxW, lineH, cls, fill, maxLines) {
  const words = s.split(" "); let line = "", n = 0;
  for (let i = 0; i < words.length && n < maxLines; i++) {
    const test = line ? line + " " + words[i] : words[i];
    if (line && measure(test, cls) > maxW) { txt(g, line, x, base + n * lineH, cls, fill); n++; line = words[i]; }
    else line = test;
  }
  if (line && n < maxLines) txt(g, line, x, base + n * lineH, cls, fill);
}

// ============================================================ SETTING
function drawSetting(s) {
  let title, l1, l2, icon, tcol;
  if (!net.online) { title = "TERPUTUS"; icon = "red"; tcol = C.RED; l1 = "Perangkat ini tidak ada internet"; l2 = "Periksa koneksi jaringan."; }
  else if (net.supaOk && s.hasData) {
    title = "TERHUBUNG"; icon = "green"; tcol = C.GREEN;
    l1 = deviceId + (net.rssi != null ? "  (" + net.rssi + " dBm)" : "") + (s.online ? "" : "  - OFFLINE");
    l2 = "Supabase: " + net.supaMsg + (s.updTime ? "  -  " + s.updTime + " WIB" : "");
  } else if (net.supaMsg === "menunggu...") { title = "MENGHUBUNGKAN"; icon = "yellow"; tcol = C.YELLOW; l1 = "Supabase: " + CFG.SUPABASE_URL.replace("https://", "").split(".")[0]; l2 = "Mohon tunggu..."; }
  else { title = "GAGAL"; icon = "red"; tcol = C.RED; l1 = "Supabase: " + net.supaMsg; l2 = "Cek Device ID / tabel / key."; }
  region("sStatus", [title, l1, l2, tcol].join("|"), g => {
    $("sIcon").setAttribute("href", WIFI[icon]);
    txt(g, title, 591, 222, "med", tcol);
    txt(g, l1, 591, 238, "body", C.SUB);
    txt(g, l2, 591, 253, "body", C.SUB);
  });
}

// ============================================================ menu / hits
const MENU = [ { y: [85, 145, 203], h: 52 }, { y: [74, 124, 176], h: 48 }, { y: [78, 129, 179], h: 48 } ];
function buildMenu() {
  const g = $("menu"); g.replaceChildren();
  MENU[page].y.forEach((y, i) => {
    const r = el("rect", { x: 8, y, width: 160, height: MENU[page].h, rx: 6, class: "hit" });
    r.addEventListener("click", () => showPage(i));
    g.appendChild(r);
  });
  const h = $("hits"); h.replaceChildren();
  const add = (x, y, w, hh, fn) => { const r = el("rect", { x, y, width: w, height: hh, rx: 8, class: "hit" }); r.addEventListener("click", fn); h.appendChild(r); };
  if (page === 0) add(415, 84, 100, 32, () => { if (alarmActive) alarmSilenced = !alarmSilenced; tick(); });
  if (page === 1) {
    add(645, 124, 135, 56, () => { alarmEnabled = !alarmEnabled; store.set("alarmOn", alarmEnabled); tick(); });
    add(706, 216, 36, 34, () => changeAlarmCm(-CFG.ALARM_STEP_CM));
    add(742, 216, 36, 34, () => changeAlarmCm(+CFG.ALARM_STEP_CM));
    add(558, 136, 90, 38, () => { if (alarmActive) alarmSilenced = !alarmSilenced; tick(); });
  }
}
function changeAlarmCm(d) {
  alarmCm = Math.min(CFG.ALARM_MAX_CM, Math.max(CFG.ALARM_MIN_CM, alarmCm + d));
  store.set("alarmCm", alarmCm); tick();
}
function showPage(p) {
  page = p;
  for (let i = 0; i < 3; i++) $("pg" + i).classList.toggle("on", i === p);
  buildMenu(); tick();
}

async function copy(s) { try { await navigator.clipboard.writeText(s); toast("Disalin: " + s); } catch (e) { toast(s); } }

  const a = r.dataset.act;
  if (a === "copyProj") copy(CFG.SUPABASE_URL);
  if (a === "copyDev") copy(deviceId);
  if (a === "reload") { net.supaMsg = "menunggu..."; net.supaOk = false; net.hasRow = false; fetchSupabase(); toast("Memuat ulang data..."); tick(); }
}));
const devInput = $("devInput");
devInput.value = deviceId;
devInput.addEventListener("change", () => {
  const v = devInput.value.trim();
  if (!v) { devInput.value = deviceId; return; }
  deviceId = v; store.set("devId", v);
  net.hasRow = false; net.supaOk = false; net.supaMsg = "menunggu...";
  toast("Device ID: " + v); fetchSupabase(); tick();
});
devInput.addEventListener("keydown", e => { if (e.key === "Enter") devInput.blur(); });

// ============================================================ SUPABASE
let fetching = false;
async function fetchSupabase() {
  if (DEMO) return demoFetch();
  if (fetching) return; fetching = true;
  const url = `${CFG.SUPABASE_URL}/rest/v1/${CFG.TABLE}?select=id,distance_cm,rssi,created_at&device_id=eq.${encodeURIComponent(deviceId)}&order=id.desc&limit=1`;
  const headers = { apikey: CFG.SUPABASE_KEY, Accept: "application/json" };
  if (CFG.SUPABASE_KEY.startsWith("eyJ")) headers.Authorization = "Bearer " + CFG.SUPABASE_KEY;
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 6000);
  try {
    const r = await fetch(url, { headers, cache: "no-store", signal: ctrl.signal });
    if (!r.ok) {
      let m = "HTTP " + r.status;
      if (r.status === 401 || r.status === 403) m = `HTTP ${r.status} cek key/RLS`;
      else if (r.status === 404) m = "HTTP 404 cek tabel";
      setSupa(false, m);
      return;
    }
    const arr = await r.json();
    if (!Array.isArray(arr)) return setSupa(false, "JSON tidak valid");
    if (!arr.length) { net.hasRow = false; return setSupa(false, "belum ada data"); }
    const row = arr[0];
    net.hasRow = true; net.rowId = row.id;
    net.distance = row.distance_cm == null ? -1 : Number(row.distance_cm);
    net.rssi = row.rssi == null ? null : Math.round(row.rssi);
    net.rowEpoch = Date.parse(row.created_at) || Date.now();
    setSupa(true, "OK");
  } catch (e) {
    setSupa(false, e.name === "AbortError" ? "timeout" : "koneksi gagal");
  } finally { clearTimeout(to); fetching = false; }
}
function setSupa(ok, m) { net.supaOk = ok; net.supaMsg = m; }

// ---- mode demo (?demo) : data simulasi tanpa Supabase
let demoDist = 40, demoId = 0;
function demoFetch() {
  demoDist += (Math.random() - 0.62) * 1.6;
  if (demoDist < 26) demoDist = 60;
  net.hasRow = true; net.rowId = ++demoId; net.distance = Math.round(demoDist * 10) / 10;
  net.rssi = -60 - Math.round(Math.random() * 3) * 5; net.rowEpoch = Date.now();
  setSupa(true, "OK");
}
if (DEMO && qs.get("demo")) demoDist = Number(qs.get("demo")) || 40;

// ============================================================ alarm sound (Web Audio)
let actx = null;
function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {} }
document.addEventListener("pointerdown", unlockAudio);
let lastBeepPhase = null;
function beep(s) {
  const on = s.alarmActive && !s.alarmSilenced && s.blink;
  if (on === lastBeepPhase) return; lastBeepPhase = on;
  if (!on || !actx || actx.state !== "running") return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = "square"; o.frequency.value = 2200; g.gain.value = 0.05;
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.4);
}

// ============================================================ loop
function tick() {
  const s = buildState();
  if (page === 0) drawDashboard(s); else if (page === 1) drawAlarm(s); else drawSetting(s);
  document.title = s.alarmActive && !s.alarmSilenced ? (s.blink ? "⚠ ALARM — Emulsion Stock" : "Emulsion Stock Monitor") : "Emulsion Stock Monitor";
  beep(s);
}
